services:
  postgres:
    image: postgres:16-alpine
    container_name: emissions_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emissions
      POSTGRES_USER: emissions
      POSTGRES_PASSWORD: emissions
    ports:
      - "5432:5432"
    volumes:
      - emissions_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emissions -d emissions"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ./highwoodemissions
      dockerfile: Dockerfile
    container_name: emissions_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://emissions:emissions@postgres:5432/emissions
    volumes:
      - ./highwoodemissions:/app
      - /app/node_modules
      - /app/.next

volumes:
  emissions_pg_data:
